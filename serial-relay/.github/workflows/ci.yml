# GitHub Actions — serial-relay
# Build Debian 11 compatible static binaries on push.
# On tag push: create a GitHub Release with binaries + .deb packages.
#
# Strategy:
#   - musl static linking → runs on any Linux, including Debian 11 (glibc 2.31)
#   - amd64 native build + aarch64 cross-compile
#   - .deb packaging via scripts/package-deb.sh (ar + tar, no dpkg-deb needed)

name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl
          rustc --version

      - name: Install arm64 cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build and package
        run: |
          set -euo pipefail
          VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dist
          echo "${VER}" > dist/.version

          # ── amd64 static ──
          echo "=== Building amd64-static ==="
          cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/serial_relay \
             dist/serial_relay-${VER}-amd64-static
          ./scripts/package-deb.sh \
            target/x86_64-unknown-linux-musl/release/serial_relay amd64 dist/

          # ── arm64 static (cross-compile) ──
          echo "=== Building arm64-static ==="
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'CARGO_EOF'
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"
          CARGO_EOF
          cargo build --release --target aarch64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/serial_relay \
             dist/serial_relay-${VER}-arm64-static
          ./scripts/package-deb.sh \
            target/aarch64-unknown-linux-musl/release/serial_relay arm64 dist/

          # ── Summary ──
          echo "=== Build artifacts ==="
          find dist/ -type f -not -name '.version' -exec ls -lh {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: serial-relay-${{ github.sha }}
          path: |
            dist/*.deb
            dist/serial_relay-*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "=== Files to upload ==="
          ls -lh dist/*.deb dist/serial_relay-*

          # Step 1: create draft release (skip if already exists)
          if gh release view "${{ github.ref_name }}" &>/dev/null; then
            echo "Release exists, reusing..."
          else
            cat > /tmp/release-notes.md <<'NOTES'
          Pre-built fully-static binaries for Debian 11 (Bullseye) and later.

          **Assets:**
          - .deb packages for amd64 and arm64
          - Raw static binaries for amd64 and arm64

          All binaries are linked against musl libc — zero runtime dependencies.
          Built from commit ${{ github.sha }}.
          NOTES
            gh release create "${{ github.ref_name }}" \
              --title "serial-relay ${{ github.ref_name }}" \
              --notes-file /tmp/release-notes.md \
              --draft
          fi

          # Step 2: upload assets
          gh release upload "${{ github.ref_name }}" \
            dist/*.deb dist/serial_relay-* --clobber

          # Step 3: publish
          gh release edit "${{ github.ref_name }}" --draft=false
