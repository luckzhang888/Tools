[package]
name = "serial-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "4-channel USB relay controller via serial (CH340)"
repository = "https://github.com/luckzhang888/Tools"
license = "MIT"

[[bin]]
name = "serial-relay"
path = "src/main.rs"

# Serial port baud rate — change here to match your relay module
[package.metadata]
baud_rate = 9600

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# The CLI opens an explicit device path and never enumerates serial ports.
# Disabling libudev makes cross-compilation and deployment self-contained.
serialport = { version = "4.9", default-features = false }

[build-dependencies]
toml = "1.1"
